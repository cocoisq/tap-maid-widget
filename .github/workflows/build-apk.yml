
name: Build Tap Maid Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o TapMaidWidget_Android_ReadyToUpload.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create JVM compatibility settings
        run: |
          cat > "$RUNNER_TEMP/align-jvm.init.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.class.name.contains("KotlinCompile")) {
                      task.kotlinOptions.jvmTarget = "1.8"
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -I "$RUNNER_TEMP/align-jvm.init.gradle" \
            -p extracted/TapMaidWidget_Release \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-maid-debug-apk
          path: extracted/TapMaidWidget_Release/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
